<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#0e131b;--panel:#151d27;--line:#25313f;--tx:#e6edf7;--tx2:#93a3b8;--acc:#4f8bff;--ok:#2fbf8f;--bad:#f0605f}
  *{box-sizing:border-box}
  body{margin:0;width:320px;background:var(--bg);color:var(--tx);
    font:13px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:14px}
  h1{font-size:13.5px;margin:0 0 2px;font-weight:600}
  .sub{font-size:11.5px;color:var(--tx2);margin-bottom:12px}
  label{display:block;font-size:11.5px;color:var(--tx2);margin:10px 0 4px}
  input{width:100%;padding:7px 9px;border-radius:7px;border:1px solid var(--line);
    background:#0a0f16;color:var(--tx);outline:none;font-size:12.5px}
  input:focus{border-color:var(--acc)}
  button{width:100%;margin-top:14px;padding:9px;border-radius:8px;border:0;background:var(--acc);
    color:#fff;font-size:13px;cursor:pointer;font-weight:500}
  button:disabled{opacity:.55;cursor:default}
  #log{margin-top:12px;font-size:11.5px;line-height:1.65;color:var(--tx2);min-height:18px;white-space:pre-wrap;word-break:break-all}
  .ok{color:var(--ok)}
  .bad{color:var(--bad)}
  .tip{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px;color:#6b7a90;line-height:1.6}
</style>
</head>
<body>
  <h1>抓取 WorkBuddy 登录态</h1>
  <div class="sub">在已登录 workbuddy.cn 的标签页里使用</div>

  <label for="server">工作台地址</label>
  <input id="server" type="text" placeholder="https://wb.example.com" spellcheck="false">

  <label for="code">配对码</label>
  <input id="code" type="text" placeholder="6 位数字" maxlength="6" inputmode="numeric">

  <button id="go">抓取并上报</button>
  <div id="log"></div>
  <div class="tip">扩展只读取当前页面已存在的登录态，不会上传密码。会优先用页面同源请求验证（能拿到真实的小喵与签到状态），然后连同 Cookie 与令牌一起回传到你的工作台。</div>

  <script src="popup.js"></script>
</body>
</html>
