<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="/wb-logo.svg">
<title>WorkBuddy 账号工作台</title>
<style>
:root{
  --bg:#04060c;
  --bg2:#070b14;
  --panel:rgba(12,18,31,.72);
  --panel2:rgba(17,25,41,.88);
  --panel3:rgba(25,35,55,.9);
  --line:rgba(120,160,220,.13);
  --line2:rgba(120,175,255,.30);
  --tx:#e9effb;
  --tx2:#93a6c4;
  --tx3:#5f7291;
  --muted:var(--tx3);
  --acc:#38bdf8;
  --acc2:#818cf8;
  --acc3:#22d3ee;
  --accSoft:rgba(56,189,248,.13);
  --ok:#34d399;
  --okSoft:rgba(52,211,153,.13);
  --warn:#fbbf24;
  --warnSoft:rgba(251,191,36,.13);
  --bad:#fb7185;
  --badSoft:rgba(251,113,133,.13);
  --r:14px; --r2:10px; --r3:8px;
  --sh:0 12px 34px rgba(0,0,0,.5);
  --shSoft:0 6px 18px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.6 var(--sans);
  -webkit-font-smoothing:antialiased;overflow:hidden;
  font-feature-settings:"tnum" 1;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc);text-decoration:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(90,130,190,.28);border-radius:6px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(110,160,230,.45);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 背景特效 ---------- */
.bg-fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-fx .grid{
  position:absolute;inset:-2px;
  background-image:
    linear-gradient(rgba(110,165,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(110,165,255,.10) 1px,transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 10%,transparent 72%);
  mask-image:radial-gradient(ellipse 120% 90% at 50% 0%,#000 10%,transparent 72%);
}
.bg-fx .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.bg-fx .b1{width:520px;height:520px;left:-140px;top:-200px;background:rgba(34,211,238,.16)}
.bg-fx .b2{width:620px;height:620px;right:-220px;top:-240px;background:rgba(129,140,248,.16)}
.bg-fx .b3{width:520px;height:520px;left:38%;bottom:-320px;background:rgba(56,189,248,.10)}
.bg-fx .scan{
  position:absolute;left:0;right:0;height:180px;top:-180px;
  background:linear-gradient(180deg,transparent,rgba(56,189,248,.05),transparent);
  animation:scanDown 9s linear infinite;
}
@keyframes scanDown{0%{top:-180px}100%{top:100%}}

/* ---------- 登录 ---------- */
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;z-index:100;
  background:radial-gradient(1100px 620px at 50% -12%,rgba(56,189,248,.12),transparent 62%),
    radial-gradient(760px 520px at 50% 120%,rgba(129,140,248,.10),transparent 60%),
    rgba(4,6,12,.72)}
.gate-card{width:100%;max-width:390px;position:relative;
  background:linear-gradient(180deg,rgba(16,23,38,.92),rgba(9,13,23,.94));
  border:1px solid var(--line);border-radius:18px;padding:34px 30px 28px;box-shadow:var(--sh);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.gate-card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(56,189,248,.55),rgba(129,140,248,.12) 42%,transparent 72%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.gate-logo{width:54px;height:54px;border-radius:15px;
  display:grid;place-items:center;margin-bottom:18px;
  box-shadow:0 10px 30px rgba(14,199,168,.34),0 0 0 1px rgba(255,255,255,.12),0 0 0 6px rgba(14,199,168,.08)}
.gate-logo img{width:54px;height:54px;border-radius:15px;display:block}
.gate-card h1{margin:0 0 6px;font-size:19px;letter-spacing:.4px;font-weight:650}
.gate-card p{margin:0 0 22px;color:var(--tx2);font-size:13px}
.gate-card .hint{margin-top:16px;font-size:12px;color:var(--tx3);line-height:1.6}
.gate-tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:2px;color:var(--acc);
  border:1px solid rgba(56,189,248,.3);border-radius:4px;padding:2px 7px;margin-bottom:14px;
  background:rgba(56,189,248,.07)}
/* HUD 四角装饰 */
.hud-br{position:absolute;width:18px;height:18px;pointer-events:none;z-index:2;
  border-color:rgba(56,189,248,.6);border-style:solid;border-width:0}
.hud-tl{top:10px;left:10px;border-top-width:2px;border-left-width:2px}
.hud-tr{top:10px;right:10px;border-top-width:2px;border-right-width:2px}
.hud-bl{bottom:10px;left:10px;border-bottom-width:2px;border-left-width:2px}
.hud-br2{bottom:10px;right:10px;border-bottom-width:2px;border-right-width:2px}

/* ---------- 布局 ---------- */
#app{display:none;height:100%;position:relative;z-index:1}
#app.on{display:flex}
.side{width:252px;flex:0 0 252px;position:relative;
  background:linear-gradient(180deg,rgba(8,12,21,.92),rgba(5,8,14,.96));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:16px 12px;gap:4px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.side::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;
  background:linear-gradient(180deg,rgba(56,189,248,.5),rgba(129,140,248,.18) 40%,transparent)}
.brand{display:flex;align-items:center;gap:12px;padding:6px 8px 18px}
.brand-mark{width:38px;height:38px;border-radius:11px;
  display:grid;place-items:center;flex:0 0 38px;position:relative;
  box-shadow:0 6px 18px rgba(14,199,168,.32),0 0 0 1px rgba(255,255,255,.1)}
.brand-mark img{width:38px;height:38px;border-radius:11px;display:block}
.brand-mark::after{content:"";position:absolute;inset:-4px;border-radius:15px;border:1px solid rgba(14,199,168,.28)}
.brand-txt{min-width:0;flex:1}
.brand-txt b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.brand-txt span{display:block;font-size:10.5px;color:var(--tx3);font-family:var(--mono);letter-spacing:1.2px;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow:auto}
.nav-sec{font-family:var(--mono);font-size:12.5px;letter-spacing:3px;color:#8fb3d9;
  text-transform:uppercase;padding:16px 12px 7px;font-weight:600;opacity:1;
  text-shadow:0 0 14px rgba(56,189,248,.25)}
.nav button{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r2);
  background:none;border:0;color:var(--tx2);cursor:pointer;text-align:left;transition:.16s}
.nav button:hover{background:rgba(56,189,248,.07);color:var(--tx)}
.nav button.on{background:linear-gradient(90deg,rgba(56,189,248,.18),rgba(129,140,248,.06) 70%,transparent);
  color:#d9ecff;box-shadow:inset 0 0 0 1px rgba(56,189,248,.18)}
.nav button.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--acc3),var(--acc2));box-shadow:0 0 10px rgba(56,189,248,.9)}
.nav button.on svg{color:var(--acc)}
.nav button svg{flex:0 0 16px;color:var(--tx3);transition:.16s}
.nav .badge{margin-left:auto;font-size:10.5px;padding:1px 7px;border-radius:20px;background:rgba(255,255,255,.06);
  color:var(--tx2);font-family:var(--mono);font-variant-numeric:tabular-nums}
.nav button.on .badge{background:rgba(56,189,248,.2);color:#bfe4ff}
.nav button .badge.err{background:var(--badSoft);color:#ff9aa8}
.side-foot{padding:12px 10px 2px;border-top:1px solid var(--line);font-size:11.5px;color:var(--tx3);display:flex;flex-direction:column;gap:7px}
.side-foot .row{display:flex;align-items:center;justify-content:space-between;gap:8px;font-family:var(--mono);letter-spacing:.3px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block;margin-right:6px;
  box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pulseDot 2.4s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{height:62px;flex:0 0 62px;position:relative;border-bottom:1px solid var(--line);display:flex;align-items:center;
  padding:0 22px;gap:16px;background:rgba(6,9,16,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(56,189,248,.55),rgba(129,140,248,.3),transparent)}
.top h2{margin:0;font-size:18px;font-weight:650;letter-spacing:.4px;white-space:nowrap;flex:0 0 auto;line-height:1.15}
.top .sub{font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;
  max-width:100%;line-height:1.2}
/* 标题区按内容宽度占位，右侧元信息与按钮靠 auto margin 推到最右 */
.top .grow{flex:0 0 auto;min-width:0}
.top-meta{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:13px;color:var(--tx2);letter-spacing:.8px;font-weight:500;
  flex:0 0 auto;margin-left:auto}
.top-meta b{color:#cfe8ff;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums}
.top-meta .sep{width:1px;height:16px;background:var(--line)}
.content{flex:1;overflow:auto;padding:22px;scroll-behavior:smooth}
.wrap{max-width:1240px;margin:0 auto}

/* ---------- 通用组件 ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r3);
  border:1px solid var(--line2);background:rgba(255,255,255,.03);color:var(--tx);cursor:pointer;
  transition:.16s;white-space:nowrap;font-size:13px}
.btn:hover{background:rgba(56,189,248,.1);border-color:rgba(56,189,248,.45);box-shadow:0 0 16px rgba(56,189,248,.14)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,var(--acc3),var(--acc2));border-color:transparent;color:#04121c;font-weight:600;
  box-shadow:0 6px 20px rgba(56,189,248,.28)}
.btn.primary:hover{filter:brightness(1.08);box-shadow:0 8px 26px rgba(56,189,248,.4)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{background:rgba(255,255,255,.05);color:var(--tx);box-shadow:none}
.btn.danger{color:#ffb0bb;border-color:rgba(251,113,133,.35);background:var(--badSoft)}
.btn.danger:hover{background:rgba(251,113,133,.2)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:7px}
.btn svg{flex:0 0 auto}

.card{position:relative;padding:17px 19px;
  background:
    linear-gradient(90deg,rgba(56,189,248,.55),rgba(56,189,248,.55)) left top/15px 1px no-repeat,
    linear-gradient(180deg,rgba(56,189,248,.55),rgba(56,189,248,.55)) left top/1px 15px no-repeat,
    linear-gradient(270deg,rgba(129,140,248,.42),rgba(129,140,248,.42)) right top/15px 1px no-repeat,
    linear-gradient(180deg,rgba(129,140,248,.42),rgba(129,140,248,.42)) right top/1px 15px no-repeat,
    linear-gradient(90deg,rgba(129,140,248,.42),rgba(129,140,248,.42)) left bottom/15px 1px no-repeat,
    linear-gradient(0deg,rgba(129,140,248,.42),rgba(129,140,248,.42)) left bottom/1px 15px no-repeat,
    linear-gradient(270deg,rgba(56,189,248,.55),rgba(56,189,248,.55)) right bottom/15px 1px no-repeat,
    linear-gradient(0deg,rgba(56,189,248,.55),rgba(56,189,248,.55)) right bottom/1px 15px no-repeat,
    linear-gradient(180deg,rgba(17,25,40,.86),rgba(10,15,25,.92));
  border:1px solid var(--line);border-radius:var(--r);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shSoft);overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;opacity:.5;
  background:linear-gradient(135deg,rgba(56,189,248,.45),rgba(129,140,248,.10) 38%,transparent 70%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude}
.card+.card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.card-h h3{margin:0;font-size:13.5px;font-weight:650;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.card-h h3::before{content:"";width:3px;height:13px;border-radius:2px;background:linear-gradient(180deg,var(--acc3),var(--acc2));
  box-shadow:0 0 8px rgba(56,189,248,.7)}
.card-h .grow{flex:1}
.muted{color:var(--tx2)}
.tiny{font-size:12px;color:var(--tx3);line-height:1.65}
.mono{font-family:var(--mono);font-size:12.5px;letter-spacing:.2px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}

.stat{position:relative;overflow:hidden;
  background:
    linear-gradient(90deg,rgba(56,189,248,.5),rgba(56,189,248,.5)) left top/13px 1px no-repeat,
    linear-gradient(180deg,rgba(56,189,248,.5),rgba(56,189,248,.5)) left top/1px 13px no-repeat,
    linear-gradient(270deg,rgba(129,140,248,.4),rgba(129,140,248,.4)) right bottom/13px 1px no-repeat,
    linear-gradient(0deg,rgba(129,140,248,.4),rgba(129,140,248,.4)) right bottom/1px 13px no-repeat,
    linear-gradient(180deg,rgba(18,26,42,.88),rgba(10,15,25,.92));
  border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shSoft);transition:.2s}
.stat:hover{transform:translateY(-2px);border-color:rgba(56,189,248,.28);box-shadow:0 14px 34px rgba(0,0,0,.45)}
.stat::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--acc3),var(--acc2),transparent)}
.stat::after{content:"";position:absolute;right:-26px;bottom:-26px;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle,rgba(56,189,248,.10),transparent 70%);pointer-events:none}
.stat .k{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:7px;letter-spacing:.6px;text-transform:uppercase}
.stat .k svg{opacity:.7}
.stat .v{font-size:27px;font-weight:650;letter-spacing:-.8px;margin-top:8px;
  color:#dceeff;text-shadow:0 0 26px rgba(56,189,248,.4);font-variant-numeric:tabular-nums;line-height:1.15}
.stat .d{font-size:11.5px;color:var(--tx3);margin-top:4px}
.stat.acc .v{color:#8fd8ff;text-shadow:0 0 22px rgba(56,189,248,.45)}
.stat.ok .v{color:#5eead4;text-shadow:0 0 22px rgba(52,211,153,.4)}
.stat.warn .v{color:#fcd34d;text-shadow:0 0 22px rgba(251,191,36,.35)}
.stat.bad .v{color:#fda4af;text-shadow:0 0 22px rgba(251,113,133,.4)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;
  background:rgba(255,255,255,.05);color:var(--tx2);white-space:nowrap;border:1px solid rgba(255,255,255,.05)}
.pill.info{background:var(--accSoft);color:#7dd3fc;border-color:rgba(56,189,248,.28)}
.pill.error{background:var(--badSoft);color:#fda4af;border-color:rgba(251,113,133,.28)}
.pill.other{background:rgba(255,255,255,.05);color:var(--tx2);border-color:var(--line)}
.pill.ok{background:var(--okSoft);color:#6ee7b7;border-color:rgba(52,211,153,.28)}
.pill.warn{background:var(--warnSoft);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.pill.bad{background:var(--badSoft);color:#fda4af;border-color:rgba(251,113,133,.28)}
.pill.acc{background:var(--accSoft);color:#7dd3fc;border-color:rgba(56,189,248,.3)}

.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.bar>i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--acc3),var(--acc2));
  box-shadow:0 0 12px rgba(56,189,248,.55);transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.low>i{background:linear-gradient(90deg,var(--warn),var(--bad));box-shadow:0 0 12px rgba(251,113,133,.45)}

.empty{text-align:center;padding:38px 16px;color:var(--tx3)}
.empty b{display:block;color:var(--tx2);font-size:13.5px;margin-bottom:6px;font-weight:500}

/* 账号卡 */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.acard{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(18,26,42,.85),rgba(10,15,25,.9));
  border:1px solid var(--line);border-radius:var(--r);padding:16px 17px;
  display:flex;flex-direction:column;gap:12px;transition:.2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shSoft)}
.acard:hover{border-color:rgba(56,189,248,.3);transform:translateY(-2px);box-shadow:0 16px 38px rgba(0,0,0,.45)}
.acard.off{opacity:.55}
.acard.err{border-color:rgba(251,113,133,.42)}
.acard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
  background:linear-gradient(180deg,var(--acc3),var(--acc2));opacity:.8}
.acard.err::before{background:linear-gradient(180deg,var(--bad),rgba(251,113,133,.2))}
.acard.off::before{opacity:.25}
.acard-top{display:flex;align-items:center;gap:11px;min-width:0}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:600;font-size:14px;
  font-family:var(--mono);background:linear-gradient(140deg,rgba(56,189,248,.22),rgba(129,140,248,.14));
  color:#a9dcff;flex:0 0 38px;box-shadow:inset 0 0 0 1px rgba(56,189,248,.25)}
.acard-name{min-width:0;flex:1}
.acard-name b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acard-name span{display:block;font-size:11px;color:var(--tx3);font-family:var(--mono)}
.acard-credit{display:block}
.acard-credit b{font-size:23px;font-weight:650;letter-spacing:-.8px;color:#d5eaff;white-space:nowrap;display:block;
  text-shadow:0 0 20px rgba(56,189,248,.35);font-variant-numeric:tabular-nums}
.acard-credit small{font-size:11px;color:var(--tx3);text-align:left;line-height:1.65;display:block;margin-top:3px;
  white-space:normal;overflow:visible;word-break:break-word}
.acard-meta{display:flex;flex-wrap:wrap;gap:6px}
.acard-foot{display:flex;align-items:center;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.acard-foot .grow{flex:1}
.switch{position:relative;width:36px;height:20px;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid var(--line);
  cursor:pointer;transition:.2s;flex:0 0 36px}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#7f8ea5;transition:.2s}
.switch.on{background:rgba(56,189,248,.28);border-color:rgba(56,189,248,.45)}
.switch.on:after{left:18px;background:var(--acc);box-shadow:0 0 10px rgba(56,189,248,.9)}

/* 积分：实时标记 / 到期倒计时 / 流水 */
.cnum{display:inline-flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.live{font-family:var(--mono);font-size:10.5px;letter-spacing:.3px;color:var(--tx3);border:1px solid var(--line);
  border-radius:20px;padding:0 7px;line-height:1.6;white-space:nowrap;background:rgba(255,255,255,.03)}
.live.fresh{color:#6ee7b7;border-color:rgba(52,211,153,.35);background:var(--okSoft)}
.live.stale{color:#fcd34d;border-color:rgba(251,191,36,.32);background:var(--warnSoft)}
.exp{font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.exp.bad{color:#fda4af}
.exp.warn{color:#fcd34d}
.exp.calm{color:var(--tx3)}
.ledger{display:flex;flex-direction:column}
.lg-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.lg-row:last-child{border-bottom:0}
.lg-row:hover{background:rgba(56,189,248,.035)}
.lg-row .t{font-family:var(--mono);font-size:11.5px;color:var(--tx3);flex:0 0 auto;white-space:nowrap}
.lg-row .who{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-row .d{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:650;flex:0 0 auto}
.delta.up{color:#6ee7b7}
.delta.down{color:#fda4af}

/* 表单 */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field>label{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px;letter-spacing:.4px}
.field .help{font-size:11.5px;color:var(--tx3);line-height:1.6}
input[type=text],input[type=password],input[type=number],input[type=time],select,textarea{
  width:100%;padding:9px 12px;border-radius:var(--r3);border:1px solid var(--line2);
  background:rgba(4,7,13,.6);color:var(--tx);outline:none;transition:.16s;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:rgba(56,189,248,.6);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
textarea{resize:vertical;min-height:74px;font-family:var(--mono);font-size:12.5px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px}
.inline{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline>.field{flex:1;min-width:150px;margin-bottom:0}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .t b{display:block;font-size:13px;font-weight:500}
.rowline .t span{display:block;font-size:11.5px;color:var(--tx3)}

/* 列表 */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);transition:.14s}
.item:hover{background:rgba(56,189,248,.035)}
.item:last-child{border-bottom:0}
.item .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 30px;
  background:rgba(255,255,255,.05);color:var(--tx2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.item .ico.bad{background:var(--badSoft);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(251,113,133,.25)}
.item .ico.warn{background:var(--warnSoft);color:var(--warn);box-shadow:inset 0 0 0 1px rgba(251,191,36,.25)}
.item .ico.ok{background:var(--okSoft);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(52,211,153,.25)}
.item .txt{flex:1;min-width:0}
.item .txt>b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .txt>span{display:block;font-size:11.5px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .acts{display:flex;gap:6px;flex:0 0 auto;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.item .txt b .pill{vertical-align:1px;margin-left:2px}

/* 签到热力 */
.heat{display:grid;grid-template-columns:repeat(18,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.heat i.on{background:linear-gradient(140deg,rgba(52,211,153,.85),rgba(56,189,248,.7));box-shadow:0 0 8px rgba(52,211,153,.4)}
.heat i.mid{background:rgba(52,211,153,.32)}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--tx3);margin-top:10px}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(3,5,10,.72);backdrop-filter:blur(4px);z-index:90;display:none}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);z-index:91;transform:translateX(102%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(11,16,27,.97),rgba(6,9,16,.99));
  border-left:1px solid rgba(56,189,248,.24);box-shadow:-24px 0 60px rgba(0,0,0,.55)}
.drawer.on{transform:none}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-h h3{margin:0;font-size:14.5px;font-weight:650;letter-spacing:.4px;flex:1}
.drawer-b{padding:20px;overflow:auto;flex:1}
.drawer-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

/* 提示 */
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(16,23,38,.95);border:1px solid var(--line2);border-radius:var(--r2);padding:9px 16px;
  font-size:13px;box-shadow:var(--sh);max-width:min(520px,90vw);animation:tin .22s ease-out;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.toast.ok{border-color:rgba(52,211,153,.45);box-shadow:0 8px 26px rgba(52,211,153,.12)}
.toast.bad{border-color:rgba(251,113,133,.5);box-shadow:0 8px 26px rgba(251,113,133,.12)}
.toast.warn{border-color:rgba(251,191,36,.45)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 代码块 */
.code{background:rgba(2,4,8,.78);border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;
  font-family:var(--mono);font-size:12px;line-height:1.75;overflow:auto;color:#a9c6ee;white-space:pre;position:relative}
.code .copy{position:absolute;top:8px;right:8px}

/* 表格 */
.tbl{width:100%;font-size:12px;border-collapse:collapse;font-family:var(--mono)}
.tbl thead th{text-align:left;padding:7px 9px;font-weight:500;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;
  font-size:10.5px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl tbody td{padding:6px 9px;border-bottom:1px solid rgba(120,160,220,.07);white-space:nowrap}
.tbl tbody tr:hover{background:rgba(56,189,248,.05)}
.tbl .num{font-variant-numeric:tabular-nums}

/* 系统状态条 */
.sysbar{display:flex;flex-wrap:wrap;gap:0;padding:0;align-items:stretch}
.sysbar::before{display:none}
.syscell{flex:1 1 190px;display:flex;align-items:center;gap:11px;padding:14px 18px;
  border-right:1px solid var(--line);position:relative}
.syscell:last-child{border-right:0}
.syscell .dot{width:8px;height:8px;flex:0 0 8px;margin:0}
.syscell .dot.off{background:var(--tx3);animation:none;box-shadow:none}
.syscell .t{min-width:0}
.syscell .t b{display:block;font-size:14.5px;font-weight:650;color:#d5eaff;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.syscell .t span{display:block;font-size:11px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:760px){
  .syscell{border-right:0;border-bottom:1px solid var(--line);flex-basis:50%}
  .syscell:nth-child(2n){border-right:0}
}

/* ---------- 运行日志控制台 ---------- */
.log-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.log-filters{display:flex;gap:4px;padding:3px;border-radius:9px;background:rgba(255,255,255,.04);
  border:1px solid var(--line)}
.log-filters button{padding:4px 11px;border-radius:7px;border:0;background:transparent;color:var(--tx2);
  cursor:pointer;font-size:12px;transition:.15s;display:flex;align-items:center;gap:6px}
.log-filters button:hover{color:var(--tx)}
.log-filters button.on{background:linear-gradient(135deg,rgba(56,189,248,.26),rgba(129,140,248,.18));color:#dff0ff;
  box-shadow:inset 0 0 0 1px rgba(56,189,248,.32)}
.log-filters .cnt{font-family:var(--mono);font-size:10.5px;color:var(--tx3)}
.log-search{position:relative;flex:1;min-width:190px;max-width:340px}
.log-search input{width:100%;padding-left:32px;font-size:12.5px}
.log-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);pointer-events:none}
.log-console{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;
  background:linear-gradient(180deg,rgba(8,12,20,.86),rgba(5,8,14,.9));
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.log-console .hud-br{position:absolute;width:16px;height:16px;pointer-events:none;z-index:3;
  border-color:rgba(56,189,248,.6);border-style:solid;border-width:0}
.log-console .hud-tl{top:0;left:0;border-top-width:2px;border-left-width:2px;border-top-left-radius:var(--r)}
.log-console .hud-br2{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px;border-bottom-right-radius:var(--r)}
.log-head{display:grid;grid-template-columns:150px 74px 1fr auto;gap:12px;align-items:center;padding:9px 14px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.025);font-family:var(--mono);font-size:10.5px;
  color:var(--tx3);letter-spacing:1.4px;text-transform:uppercase}
.log-head .grow{flex:1}
.log-rows{max-height:min(62vh,620px);overflow:auto}
.lrow{display:grid;grid-template-columns:150px 74px 1fr;gap:12px;align-items:baseline;padding:8px 14px;
  border-bottom:1px solid rgba(120,160,220,.06);transition:.12s}
.lrow:hover{background:rgba(56,189,248,.05)}
.lrow .t{font-family:var(--mono);font-size:11.5px;color:var(--tx3);white-space:nowrap}
.lrow .lv{font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;text-align:center;
  padding:1px 0;border-radius:5px;border:1px solid transparent}
.lrow .m{font-size:13px;color:#cfe0f5;word-break:break-word;line-height:1.6}
.lrow .m .x{color:var(--tx3);font-family:var(--mono);font-size:11.5px;margin-left:8px}
.lv-info{background:var(--accSoft);color:#7dd3fc;border-color:rgba(56,189,248,.28)}
.lv-warn{background:var(--warnSoft);color:#fcd34d;border-color:rgba(251,191,36,.28)}
.lv-error{background:var(--badSoft);color:#fda4af;border-color:rgba(251,113,133,.3)}
.lv-other{background:rgba(255,255,255,.05);color:var(--tx2);border-color:var(--line)}
.log-row-err{box-shadow:inset 2px 0 0 rgba(251,113,133,.55)}
.log-row-warn{box-shadow:inset 2px 0 0 rgba(251,191,36,.45)}
.log-row-info{box-shadow:inset 2px 0 0 rgba(56,189,248,.28)}
.log-foot{padding:9px 14px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;
  font-family:var(--mono);font-size:10.5px;color:var(--tx3);letter-spacing:.8px;flex-wrap:wrap}
.log-foot .grow{flex:1}
.log-empty{padding:44px 16px;text-align:center;color:var(--tx3);font-family:var(--mono);font-size:12.5px;letter-spacing:.5px}

/* 移动端 */
.tabbar{display:none}
@media (max-width:900px){
  .side{display:none}
  #app{flex-direction:column}
  .top{height:56px;flex-basis:56px;padding:0 14px}
  .content{padding:14px 14px 86px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3,.g2{grid-template-columns:1fr}
  .accs{grid-template-columns:1fr}
  .top-meta{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:64px;background:rgba(6,9,16,.94);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:60;
    padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;min-width:0;background:none;border:0;color:var(--tx3);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;font-size:10.5px;cursor:pointer;padding:6px 0}
  .tabbar button.on{color:var(--acc)}
  .tabbar button.on svg{filter:drop-shadow(0 0 6px rgba(56,189,248,.7))}
  .tabbar button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .drawer{width:100%}
  .heat{grid-template-columns:repeat(12,1fr)}
  .lrow{grid-template-columns:1fr;gap:3px;padding:9px 11px}
  .lrow .t{font-size:10.5px;opacity:.8}
  .lrow .lv{justify-self:start;padding:1px 8px}
  .lrow .m{font-size:12.5px}
  .log-head{display:none}
  .log-console{border-radius:var(--r2)}
  .log-search{max-width:none}
}
@media (max-width:560px){ .g4{grid-template-columns:1fr 1fr} }
@media (max-width:640px){
  .top .sub{display:none}
  #btnLogout{display:none}
  .top{gap:8px}
  #topActions .btn{padding:6px 10px;font-size:12px}
}

<body>

<!-- 背景特效层 -->
<div class="bg-fx" aria-hidden="true">
  <div class="grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="scan"></div>
</div>

<!-- 登录 -->
<div id="gate">
  <form class="gate-card" id="loginForm" autocomplete="on">
    <span class="hud-br hud-tl"></span><span class="hud-br hud-tr"></span>
    <span class="hud-br hud-bl"></span><span class="hud-br hud-br2"></span>
    <div class="gate-logo">
      <img src="/wb-logo.svg" alt="WorkBuddy" width="34" height="34">
    </div>
    <span class="gate-tag">WORKBUDDY CONSOLE</span>
    <h1>WorkBuddy 账号工作台</h1>
    <p id="gateDesc">请输入管理员口令进入控制台</p>
    <div class="field">
      <label for="pw">管理员口令</label>
      <input id="pw" type="password" placeholder="至少 8 位" autocomplete="current-password" required>
    </div>
    <button class="btn primary" type="submit" id="loginBtn" style="width:100%;justify-content:center;padding:10px">
      进入控制台
    </button>
    <div class="hint" id="gateHint">首次使用：在这里**设置一个你自己的密码**（至少 8 位），输入后即完成初始化。<br>这个密码只有你知道，忘记后在服务器删除 <span class="mono">data/</span> 会清空数据，请务必牢记。</div>
  </form>
</div>

<!-- 主界面 -->
<div id="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">
        <img src="/wb-logo.svg" alt="WorkBuddy" width="26" height="26">
      </div>
      <div class="brand-txt"><b id="brandName">账号工作台</b><span>WorkBuddy Console</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span><span class="dot"></span> 服务运行中</span><span id="footTime" class="mono"></span></div>
      <div class="row"><span>定时任务</span><span id="footSched">-</span></div>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <div class="grow" style="display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;min-width:0">
        <h2 id="pageTitle">概览</h2>
        <span class="sub" id="pageSub"></span>
      </div>
      <div class="top-meta" id="topMeta"></div>
      <div id="topActions" style="display:flex;gap:8px;align-items:center"></div>
      <button class="btn ghost sm" id="btnLogout" title="退出登录">退出</button>
    </header>
    <!-- 授权状态条：未授权/过期时常驻显示 -->
    <div id="licBar" style="display:none;align-items:center;gap:10px;padding:9px 16px;background:rgba(220,60,60,.12);border-bottom:1px solid rgba(220,60,60,.35);color:#c33;font-size:13px">
      <span style="font-weight:600">⚠ 功能已停用</span>
      <span class="lic-txt" style="flex:1">未授权</span>
      <button class="btn sm" onclick="location.hash='#/settings'">去填授权码</button>
    </div>
    <main class="content"><div class="wrap" id="view"></div></main>
  </div>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h"><h3 id="drawerTitle">编辑</h3><button class="btn ghost sm" id="drawerClose">关闭</button></div>
  <div class="drawer-b" id="drawerBody"></div>
  <div class="drawer-f" id="drawerFoot"></div>
</aside>

<div id="toasts"></div>

<script>
'use strict';
/* ============ 基础工具 ============ */
var S = { authed:false, csrf:'', state:null, view:'home', busy:false };

function $(sel){ return document.querySelector(sel); }
function el(id){ return document.getElementById(id); }
function esc(s){
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function num(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  var v = Number(n);
  if (Math.abs(v) >= 100000000) return (v/100000000).toFixed(2) + '亿';
  if (Math.abs(v) >= 10000) return (v/10000).toFixed(1) + '万';
  return v.toLocaleString('zh-CN');
}
/* 积分：保留最多两位小数，去掉多余的 0（上游 TotalCredits 带一长串浮点尾数） */
function fmtCredit(n){
  if (n === null || n === undefined || isNaN(n)) return '—';
  var v = Number(n);
  if (!isFinite(v)) return '—';
  var r = Math.round(v * 100) / 100;
  return r.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
}
function dt(ts){
  if (!ts) return '—';
  var d = new Date(ts);
  var p = function(x){ return String(x).padStart(2,'0'); };
  return (d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function fromNow(ts){
  if (!ts) return '';
  var s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.floor(s/60) + ' 分钟前';
  if (s < 86400) return Math.floor(s/3600) + ' 小时前';
  return Math.floor(s/86400) + ' 天前';
}
function toast(msg, kind){
  var box = el('toasts');
  var d = document.createElement('div');
  d.className = 'toast ' + (kind||'');
  d.textContent = msg;
  box.appendChild(d);
  setTimeout(function(){ d.style.opacity='0'; d.style.transform='translateY(6px)'; d.style.transition='.25s'; }, 2600);
  setTimeout(function(){ d.remove(); }, 2950);
}
var ICONS = {
  home:'<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/>',
  check:'<path d="M20 6L9 17l-5-5"/>',

/* ============ API ============ */
async function api(path, opts){
  opts = opts || {};
  var init = { method: opts.method || (opts.body ? 'POST':'GET'), headers:{}, credentials:'same-origin' };
  if (opts.body !== undefined){
    init.headers['content-type'] = 'application/json';
    init.body = JSON.stringify(opts.body);
  }
  if (init.method !== 'GET' && S.csrf) init.headers['x-wb-csrf'] = S.csrf;
  // 可选超时：默认不限制（长任务如代理流式），
  // 但登录这类必须给上限，否则服务端挂住时界面永远转圈、用户无从下手。
  var ms = opts.timeout || 0;
  var ctrl = null, timer = null;
  if (ms > 0 && typeof AbortController !== 'undefined'){
    ctrl = new AbortController();
    init.signal = ctrl.signal;
    timer = setTimeout(function(){ ctrl.abort(); }, ms);
  }
  var res;
  try{
    res = await fetch(path, init);
  }catch(err){
    if (timer) clearTimeout(timer);
    if (err && err.name === 'AbortError'){
      var e = new Error('请求超时（' + Math.round(ms/1000) + ' 秒）');
      e.timeout = true;
      throw e;
    }
    throw err;
  }
  if (timer) clearTimeout(timer);
  var text = await res.text();
  var data = null;
  try { data = text ? JSON.parse(text) : null; } catch(e){ data = { raw:text }; }
  if (!res.ok){
    var msg = (data && (data.error || (data.error && data.error.message))) || ('HTTP ' + res.status);
    if (res.status === 401 && path !== '/api/login'){ showGate(); }
    /* 授权闸门：服务端返回 403 + LICENCE_REQUIRED 时，弹一次明确提示并引导去设置。
       注意这只是"提示"——真正的拦截在服务端，改前端 JS 也绕不过去。 */
    if (res.status === 403 && data && data.code === 'LICENCE_REQUIRED'){
      showLicenceBlock(data.error || '未授权', data.reason || '');
    }
    var err = new Error(typeof msg === 'string' ? msg : '请求失败');
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

var _licBlockAt = 0;
function showLicenceBlock(msg, reason){
  // 10 秒内只弹一次，避免连续请求刷屏
  if (Date.now() - _licBlockAt < 10000) return;
  _licBlockAt = Date.now();
  var tip = document.getElementById('licBar');
  if (tip){
    tip.style.display = 'flex';
    tip.querySelector('.lic-txt').textContent = msg || '未授权';
  }
  toast(msg || '未授权：请填写授权码', 'bad');
  // 引导到设置页（授权码在设置里填）
  setTimeout(function(){
    try { if (location.hash !== '#/settings') location.hash = '#/settings'; } catch(e){}
  }, 600);
}

  try{

    if (L && L.ok){

      if (t) t.textContent = (L && L.message) || '未授权：请填写授权码';
    }

  }catch(e){ /* 忽略：不影响主流程 */ }
}

/* ============ 积分 / 保活 / 错峰 辅助 ============
 * 积分实时值与到期明细来自 /api/credits（POST /api/credits/refresh 拉上游），
 * 不落在 /api/state 里，所以单独缓存一份；界面上的数字优先用实时缓存，
 * 拿不到时退回 /api/state 的账号快照（标「缓存」而不是「实时」）。
 */
var CREDV = { data:null, at:0, nextExpire:null, err:'', ledger:null };
var KA_CACHE = { data:null, err:'' };

/* 后端配置项：字段缺失时给默认值，保证界面永远画得出来。
 * 注意 settings.credits 在旧库里可能整段 undefined（store 默认值没有这段），
 * 此时后端是按「开 + 30 分钟」跑的，前端必须同口径，不能显示成「未配置」。
 */
function cfgCredits(){
  var c = S.state && S.state.settings && S.state.settings.credits;
  if (!c || typeof c !== 'object') return { enabled:true, refreshMinutes:30 };
  return {
    enabled: c.enabled !== false,
    refreshMinutes: Math.max(1, Number(c.refreshMinutes) || 30)
  };
}
function cfgKeepalive(){
  var k = S.state && S.state.settings && S.state.settings.keepalive;
  if (!k || typeof k !== 'object') return { enabled:false, renewDaysThreshold:3, activeReport:false, intervalMinutes:720 };
  return {
    enabled: k.enabled === true,
    renewDaysThreshold: (k.renewDaysThreshold === undefined || k.renewDaysThreshold === null) ? 3 : Number(k.renewDaysThreshold)||0,
    activeReport: k.activeReport === true,
    intervalMinutes: (k.intervalMinutes === undefined || k.intervalMinutes === null) ? 720 : Number(k.intervalMinutes)||0
  };
}
function cfgSchedule(){
  var s = S.state && S.state.settings && S.state.settings.schedule;
  if (!s || typeof s !== 'object') return { randomDelayMinutes:0, accountDelayMinSeconds:0, accountDelayMaxSeconds:0 };
  return {
    randomDelayMinutes: Number(s.randomDelayMinutes)||0,
    accountDelayMinSeconds: Number(s.accountDelayMinSeconds)||0,
    accountDelayMaxSeconds: Number(s.accountDelayMaxSeconds)||0
  };
}
function clampNum(node, min, max, dft){
  var v = node ? Number(node.value) : NaN;
  if (!isFinite(v)) v = dft;
  return Math.max(min, Math.min(max, Math.round(v)));
}
/* 调度器的 NextIn 都是秒（null = 该功能未启用）；这里统一成人话 */
function nextInText(sec){
  var s = Number(sec);
  if (sec === null || sec === undefined || !isFinite(s)) return '';
  if (s <= 0) return '即将执行';
  if (s < 60) return Math.round(s) + ' 秒后';
  if (s < 3600) return Math.round(s / 60) + ' 分钟后';
  return (Math.round(s / 360) / 10) + ' 小时后';
}
/* 503 = 模块未就绪（后端没加载 lib 或路由没接），要给一句人能看懂的话 */
function apiErrText(err, label){
  var name = label || '模块';
  if (!err) return name + '不可用';
  if (err.status === 503) return name + '未就绪：后端暂未加载该模块（重启服务后重试）';
  if (err.status === 404) return name + '接口不存在：服务端版本较旧，重启后再试';
  return err.message || (name + '请求失败');
}

 * 界面被 refresh 弹回旧值，用户会以为是自己点坏了。这里直接说出来，不假装保存成功。 */
async function saveSection(key, val){
  var body = {};
  body[key] = val;
  var r = await api('/api/settings', { body: body });
  var got = r && r.settings && r.settings[key];
  if (!got || typeof got !== 'object'){
    toast('设置已提交，但回读不到 settings.' + key + '（可能未落库，请刷新后确认，服务端日志有原因）', 'warn');
    return false;
  }
  return true;
}

/* 到期倒计时：<3 天红、<7 天黄、其它灰 */
function expireInfo(ts){
  var t = Number(ts) || 0;
  if (!t) return { text:'无到期日', cls:'calm', days:null };
  var left = t - Date.now();
  if (left <= 0) return { text:'已过期', cls:'bad', days:0 };
  var days = left / 86400000;
  var text;
  // 天数按 floor 与后端 daysLeft 口径一致（8.4 天 → 8 天）；不足 1 天走小时/分钟，比「0 天后」有用
  if (days >= 1) text = Math.floor(days) + ' 天后到期';
  else {
    var h = Math.floor(left / 3600000);
    text = h >= 1 ? (h + ' 小时后到期') : (Math.max(1, Math.floor(left / 60000)) + ' 分钟后到期');
  }
  return { text:text, cls: days < 3 ? 'bad' : (days < 7 ? 'warn' : 'calm'), days:days };
}

/* 「实时 / 缓存 N 分前」：由 data-live-at 打点，全局 1 秒滴答刷新。
 * 超过 900 秒按「数据较旧」标黄（后端 staleSeconds 同一口径），提醒点一下刷新。 */
function liveText(at){
  var sec = Math.max(0, Math.floor((Date.now() - (Number(at) || 0)) / 1000));
  if (sec < 20) return { text:'实时', fresh:true, stale:false };
  var stale = sec > 900;
  var text;
  if (sec < 60) text = '缓存 ' + sec + 's 前';
  else if (sec < 3600) text = '缓存 ' + Math.floor(sec / 60) + ' 分前';
  else text = '缓存 ' + Math.floor(sec / 3600) + ' 小时前';
  return { text: (stale ? '数据较旧 · ' : '') + text, fresh:false, stale:stale };
}
function liveTag(at){
  var t = Number(at) || 0;
  if (!t) return '<span class="live">未同步</span>';
  var lt = liveText(t);
  return '<span class="live' + (lt.fresh ? ' fresh' : lt.stale ? ' stale' : '') + '" data-live-at="'+t+'">' + lt.text + '</span>';
}
setInterval(function(){
  var nodes = document.querySelectorAll('[data-live-at]');
  for (var i = 0; i < nodes.length; i++){
    var lt = liveText(nodes[i].getAttribute('data-live-at'));
    nodes[i].textContent = lt.text;
    if (lt.fresh){ nodes[i].classList.add('fresh'); nodes[i].classList.remove('stale'); }
    else if (lt.stale){ nodes[i].classList.add('stale'); nodes[i].classList.remove('fresh'); }
    else { nodes[i].classList.remove('fresh'); nodes[i].classList.remove('stale'); }
  }
}, 1000);

/* 统一口径：/api/state 的账号与 /api/credits 的账号字段名不完全一致，
 * 这里归一成 { at, credits, packages, nextAt, nextCred }。
 * /api/state 没有 nextExpireAt，就从 packages 里自己挑最近一笔未过期且有余额的。 */
function accCreditInfo(a){
  a = a || {};
  var pkgs = [];
  if (Array.isArray(a.packages)) pkgs = a.packages;
  var at = Number(a.at || a.quotaAt || 0) || 0;
  var nextAt = Number(a.nextExpireAt) || 0;
  var nextCred = a.nextExpireCredits;
  if (!nextAt && pkgs.length){
    var best = null;
    for (var i = 0; i < pkgs.length; i++){
      var p = pkgs[i] || {};
      var e = Number(p.expireAt) || 0;
      if (!e || e <= Date.now()) continue;
      if (p.remain !== null && p.remain !== undefined && Number(p.remain) <= 0) continue;
      if (!best || e < Number(best.expireAt)) best = p;
    }
    if (best){ nextAt = Number(best.expireAt) || 0; nextCred = best.remain; }
  }
  return { at:at, credits:a.credits, packages:pkgs, nextAt:nextAt, nextCred:nextCred };
}

/* 悬停看全部资源包：额度 / 到期 / 来源，过期包与赠送包都标出来 */
function packageTip(pkgs, nextAt, nextCred){
  var hasCred = (nextCred !== null && nextCred !== undefined && !isNaN(Number(nextCred)));
  if (!pkgs || !pkgs.length){
    if (!nextAt) return '上游未下发资源包明细';
    return '最近到期 ' + dt(nextAt) + (hasCred ? (' · ' + fmtCredit(nextCred) + ' 积分') : '');
  }
  return pkgs.map(function(p){
    var remain = (p.remain === null || p.remain === undefined) ? '?' : fmtCredit(p.remain);
    var total = (p.total === null || p.total === undefined) ? '?' : fmtCredit(p.total);
    var exp = p.expired ? '已过期' : (p.expireAt ? (dt(p.expireAt) + ' · ' + expireInfo(p.expireAt).text) : '无到期日（不限期）');
    var tag = p.giftTag ? '［赠送］' : '';
    return tag + (p.name || '资源包') + '：剩 ' + remain + ' / ' + total + ' · ' + exp;
  }).join('\n');
}
function creditChip(a){
  var info = accCreditInfo(a);
  if (!info.nextAt) return { html:'', cls:'calm', tip:packageTip(info.packages, 0, null) };
  var exp = expireInfo(info.nextAt);
  var hasCred = (info.nextCred !== null && info.nextCred !== undefined && !isNaN(Number(info.nextCred)));
  return {
    // 上游可能只给到期时刻不给那一笔的余量，此时不要显示成「— · N 天后到期」
    html: (hasCred ? (fmtCredit(info.nextCred) + ' · ') : '') + exp.text,
    cls: exp.cls,
    tip: packageTip(info.packages, info.nextAt, info.nextCred)
  };
}
function creditSummaryOf(list){
  var out = { total:0, known:0, nextAt:0, nextCred:0, soon7:0, soon7cnt:0, soon3:0, paused:0 };
  (list || []).forEach(function(a){
    var c = Number(a.credits);
    if (a.credits !== null && a.credits !== undefined && isFinite(c)){ out.total += c; out.known += 1; }
    if (a.paused) out.paused += 1;
    var info = accCreditInfo(a);
    if (!info.nextAt) return;
    if (!out.nextAt || info.nextAt < out.nextAt){ out.nextAt = info.nextAt; out.nextCred = info.nextCred; }
    var days = (info.nextAt - Date.now()) / 86400000;
    if (days <= 7){ out.soon7 += Number(info.nextCred)||0; out.soon7cnt += 1; }
    if (days <= 3) out.soon3 += Number(info.nextCred)||0;
  });
  return out;
}

function creditsRowsHtml(){

async function loadCredits(){

function paintCreditsStats(){
  var box = el('credStats');
  if (!box) return;
  var list = (CREDV.data && CREDV.data.length) ? CREDV.data : ((S.state && S.state.accounts) || []);

}
function creditsStatsHtml(list){
  var sum = creditSummaryOf(list);
  var cr = cfgCredits();
  var sched = (S.state && S.state.scheduler) || {};
  var nex = sum.nextAt ? expireInfo(sum.nextAt) : null;
  var cNext = nextInText(sched.creditsNextIn);
  return '<div class="grid g4" style="margin-bottom:14px">' +
    stat('积分合计', fmtCredit(sum.total), sum.known + ' 个账号可读 · 实时值', '', 'wave') +
    stat('最近到期', sum.nextAt ? fmtCredit(sum.nextCred) : '—',
      nex ? (dt(sum.nextAt) + ' · ' + nex.text) : '上游未下发有效期',
      nex && nex.cls === 'bad' ? 'bad' : (nex && nex.cls === 'warn' ? 'warn' : ''), 'clock') +
    stat('7 天内到期', sum.soon7 ? fmtCredit(sum.soon7) : (sum.soon7cnt ? '—' : '0'),
      sum.soon7cnt
        ? (sum.soon7cnt + ' 个账号 7 天内到期' + (sum.soon7 ? '，合计即将作废' : '（上游未下发额度）'))
        : '近期没有积分要过期',
      sum.soon3 ? 'bad' : (sum.soon7cnt ? 'warn' : 'ok'), 'alert') +
    stat('自动刷新', cr.enabled ? (cr.refreshMinutes + ' 分钟') : '已关闭',
      // creditsNextIn 指「定时全量刷新」的下一轮（基于 lastCreditsAt），
      // 单账号手动刷新不会重置它，所以这里必须写明「全量」，否则用户会以为倒计时没动是坏了
      cr.enabled ? (cNext ? ('自动全量刷新：' + cNext) : '后台定时全量刷新') : '只在你点刷新时查',
      cr.enabled ? 'ok' : 'warn', 'refresh') +
    '</div>';
}
async function loadLedger(){

function paintLedger(){

/* ---------- 运行日志（独立页） ---------- */
var LOGV = { level:'all', q:'', timer:null, data:null, counts:{info:0,warn:0,error:0,other:0}, total:0, auto:false };

function logLevelClass(lv){
  if (lv === 'info') return 'info';
  if (lv === 'warn' || lv === 'warn2') return 'warn';
  if (lv === 'error') return 'error';
  return 'other';
}
function logLevelLabel(lv){
  if (lv === 'info') return 'INFO';
  if (lv === 'warn' || lv === 'warn2') return 'WARN';
  if (lv === 'error') return 'ERROR';
  return String(lv || 'LOG').toUpperCase();
}
function logTime(iso){
  var d = new Date(iso);
  var p = function(x){ return String(x).padStart(2,'0'); };
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function logFilterRows(){
  var all = LOGV.data || [];
  var q = LOGV.q.trim().toLowerCase();
  return all.filter(function(l){
    if (LOGV.level !== 'all' && logLevelClass(l.level) !== LOGV.level) return false;
    if (q && String(l.message || '').toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function logRowsHtml(){
  var rows = logFilterRows();
  if (!rows.length){
    return '<div class="log-empty">' + ((LOGV.data && LOGV.data.length) ? '没有匹配的日志记录' : '暂无日志记录') + '</div>';
  }
  return rows.map(function(l){
    var lc = logLevelClass(l.level);
    return '<div class="lrow log-row-'+lc+'">' +
      '<span class="t">'+esc(logTime(l.at))+'</span>' +
      '<span class="lv lv-'+lc+'">'+esc(logLevelLabel(l.level))+'</span>' +
      '<span class="m">'+esc(l.message)+'</span>' +
      '</div>';
  }).join('');
}
function paintLogs(){
  var box = el('logRows');
  if (box) box.innerHTML = logRowsHtml();
  var cnt = el('logCount');
  if (cnt) cnt.textContent = logFilterRows().length + ' / ' + ((LOGV.data && LOGV.data.length) || 0) + ' 条';
  var tot = el('logTotal');
  if (tot) tot.textContent = '库中共 ' + (LOGV.total || 0) + ' 条';
  var fs = el('logFilterStats');
  if (fs){
    fs.innerHTML =
      '<span>INFO <b style="color:#7dd3fc">'+(LOGV.counts.info||0)+'</b></span>' +
      '<span class="sep"></span>' +
      '<span>WARN <b style="color:#fcd34d">'+(LOGV.counts.warn||0)+'</b></span>' +
      '<span class="sep"></span>' +
      '<span>ERROR <b style="color:#fda4af">'+(LOGV.counts.error||0)+'</b></span>';
  }
}
async function loadLogs(){
  try{
    var r = await api('/api/logs?limit=200');
    LOGV.data = r.logs || [];
    LOGV.counts = r.counts || LOGV.counts;
    LOGV.total = r.total || 0;
    paintLogs();
  }catch(e){
    var box = el('logRows');
    if (box) box.innerHTML = '<div class="log-empty">读取失败：' + esc(e.message) + '</div>';
  }
}
function logAutoRefresh(on){
  if (LOGV.timer){ clearInterval(LOGV.timer); LOGV.timer = null; }
  if (on) LOGV.timer = setInterval(loadLogs, 5000);
}

      // 上游分项累加与 TotalCredits 之间存在浮点尾差（如 2980.38000093 vs 2980.3800009300003），

      function nearEq(x, y) { return x !== null && y !== null && Math.abs(x - y) < 1e-6; }
      if (total !== null && !nearEq(total, a.credits)) sub += ' · 额度 ' + fmtCredit(total);
      if (used !== null && used > 0) sub += ' · 已用 ' + fmtCredit(used);
      if (remain !== null && !nearEq(remain, a.credits)) sub += ' · 可用 ' + fmtCredit(remain);
      if (a.quotaAt) sub += ' · ' + fromNow(a.quotaAt) + '更新';
      return '<div class="acard '+(a.enabled?'':'off')+(a.paused?' paused':'')+(a.lastError?' err':'')+'">' +
        '<div class="acard-top"><div class="avatar">'+esc(initial)+'</div>' +

            (cchip.html ? '<span class="exp ' + cchip.cls + '" title="' + esc(cchip.tip) + '">' + cchip.html + '</span>' : '') +
            '<button class="btn sm ghost" data-act="creditsRefreshOne" data-id="'+esc(a.id)+'" title="实时查询积分与到期明细">'+icon('refresh',11)+'</button>' +
          '</div><small>'+esc(sub)+'</small></div>' +
          '<div class="bar '+(low?'low':'')+'" style="margin-top:7px"><i style="width:'+pct+'%"></i></div></div>' +
        '<div class="acard-meta">'+pills+'</div>' +
        (a.lastError ? '<div class="tiny" style="color:#ff9a99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(a.lastError)+'</div>' : '') +
        '<div class="acard-foot">' +
          '<button class="btn sm" data-act="refresh" data-id="'+esc(a.id)+'">'+icon('refresh',12)+'刷新</button>' +
          '<button class="btn sm" data-act="signone" data-id="'+esc(a.id)+'">'+icon('check',12)+'签到</button>' +
          (a.phoneMasked ? '<button class="btn sm ghost" data-act="relogin" data-id="'+esc(a.id)+'" data-phone="'+esc(a.phoneMasked)+'" title="给 '+esc(a.phoneMasked)+' 发验证码重新登录">'+icon('key',12)+'重新登录</button>' : '') +
          (a.paused
            ? '<button class="btn sm" data-act="resumeAccount" data-id="'+esc(a.id)+'" title="恢复启用">'+icon('play',12)+'恢复</button>'
            : '<button class="btn sm ghost" data-act="pauseAccount" data-id="'+esc(a.id)+'" title="临时停用（可选只停转发）">'+icon('clock',12)+'停用</button>') +

/* ---------- 模型管理（白名单 + 时段免费自动选型）---------- */
var MODELV = { data:null, at:0, loading:false };

/**
 * 拉取模型目录 + 促销状态。
 * @param {boolean} force 强制绕过服务端缓存
 */
async function loadModelInfo(force){
  if(MODELV.loading) return;
  MODELV.loading = true;
  try{
    var r = await api('/api/models/info' + (force ? '?force=1' : ''));
    MODELV.data = r; MODELV.at = Date.now();
  }catch(e){
    MODELV.data = { ok:false, error:String(e && e.message || e), models:[], promotions:[] };
  }
  MODELV.loading = false;
  loadModelSync();
  // 只在「用户没有正在勾选」时重渲染整页，避免把用户勾选状态冲掉。
  // （modelSelAll/None/Free 只改 DOM 不调这里，所以勾选状态能保住）
  if(S.view === 'proxy' && typeof renderView === 'function') renderView();
}

/** 模型目录自动同步状态 */
async function loadModelSync(){
  try{
    var r = await api('/api/models/sync');
    S.msync = r;
    renderModelSync(r);
  }catch(e){
    renderModelSync(null);
  }
}

function renderModelSync(m){
  var box = document.getElementById('msyncBox');
  if(!box) return;
  if(!m){
    box.innerHTML = '<div class="tiny">同步状态读取失败（可能未授权或接口异常）</div>';
    return;
  }
  var h = '';
  if(m.lastAt){
    var t = new Date(m.lastAt).toLocaleString('zh-CN');
    var res = m.lastResult || {};
    var stTxt = res.ok
      ? '<b style="color:#3ddc97">成功</b>'
      : '<b style="color:#ff6b6b">失败</b> <span class="tiny">' + esc(res.error || '') + '</span>';
    h += '<div style="font-size:13px;line-height:1.9">'
      + '上次同步：' + esc(t) + ' · ' + stTxt + '<br>'
      + '当前目录共 <b>' + (m.totalModels||0) + '</b> 个模型';
    if(res.ok){
      h += '　本次：新增 <b>' + (res.added||0) + '</b>　下架 <b>' + (res.removed||0) + '</b>　倍率变动 <b>' + (res.rateChanged||0) + '</b>';
    }
    h += '<br><span class="tiny">同步间隔 ' + (m.intervalHours||24) + ' 小时 · 新增的免费模型会自动加入白名单，下架的会自动移除</span></div>';
  } else {
    h += '<div class="tiny">还没有同步过。点右上角「立即同步」拉取官方最新目录。</div>';
  }

  var chs = m.changes || [];
  if(chs.length){
    h += '<div style="margin-top:10px;border-top:1px solid rgba(255,255,255,.08);padding-top:8px">'
      + '<div class="tiny" style="margin-bottom:6px"><b>最近变更记录</b></div>';
    for(var i = 0; i < Math.min(chs.length, 8); i++){
      var c = chs[i];
      var d = new Date(c.at).toLocaleString('zh-CN');
      var parts = [];
      (c.added||[]).forEach(function(a){ parts.push('<span style="color:#3ddc97">+ ' + esc(a.name||a.id) + (a.free?'(免费)':'') + '</span>'); });
      (c.removed||[]).forEach(function(r){ parts.push('<span style="color:#ff6b6b">− ' + esc(r.name||r.id) + '</span>'); });
      (c.rateChanged||[]).forEach(function(r){ parts.push('<span style="color:#ffd166">~ ' + esc(r.name||r.id) + ' ' + (r.from===null?'?':'x'+r.from) + '→' + (r.to===null?'?':'x'+r.to) + '</span>'); });
      h += '<div style="font-size:12px;line-height:1.8"><span class="tiny">' + esc(d) + '</span>　' + parts.join('　') + '</div>';
    }
    h += '</div>';
  }
  box.innerHTML = h;
}

/** 倍率显示：无倍率标注的模型要明确区分于「便宜」 */
function modelRateText(m){
  if(m.rate === null || m.rate === undefined) return '<span class="tiny">无倍率标注</span>';
  if(m.rate === 0) return '<b style="color:#3ddc97">免费</b>';
  return 'x' + m.rate;
}

/** 自定义模型名的目标下拉选项（列出上游全部模型 + 当前值兜底） */
function mmTargetOptions(models, current){
  var opts = '';
  var found = false;
  for(var i = 0; i < (models||[]).length; i++){
    var m = models[i];
    var sel = (m.id === current) ? ' selected' : '';
    if(sel) found = true;
    var rateTxt = m.rate === null ? '无倍率' : (m.rate === 0 ? '★免费' : 'x'+m.rate);
    opts += '<option value="'+esc(m.id)+'"'+sel+'>'+esc(m.name)+' · '+rateTxt+'</option>';
  }
  // 当前值不在目录里（模型下线了）也要能选回来，否则保存会把映射丢掉
  if(current && !found){
    opts = '<option value="'+esc(current)+'" selected>'+esc(current)+' ·（不在当前目录）</option>' + opts;
  }
  return opts;
}

/** 促销时段的中文描述 */
function promoWindowText(p){  var sch = p.schedule || {};
  if(Array.isArray(sch.daily) && sch.daily.length){
    return sch.daily.map(function(d){ return d.start + '-' + d.end; }).join('、');
  }
  if(sch.validFrom) return String(sch.validFrom).slice(0,10) + ' ~ ' + String(sch.validUntil||'').slice(0,10);
  return '不限时段';
}

function meowStateText(r){
  if (r.dailyLimitToday && r.state !== 'arrived') return ['今日已旅行','warn'];
  if (r.state === 'arrived') return ['可领取','ok'];
  if (r.state === 'traveling') return ['旅行中','acc'];
  return ['空闲',''];
}
function meowCountdown(r, serverTime){
  if (r.state !== 'traveling' || !r.arriveAt) return '';
  var now = Date.now() + (serverTime ? (serverTime - Date.now()) : 0);
  var left = Math.max(0, r.arriveAt * 1000 - now);
  if (!left) return '即将到达';
  var mm = Math.floor(left/60000), ss = Math.floor((left%60000)/1000);
  return '还剩 ' + mm + ' 分 ' + (ss<10?'0':'') + ss + ' 秒';
}

    '「立即保活」会立刻跑一轮续期（外加一次活跃上报尝试），结果同步写进运行日志。</div></div>';
}
function scheduleCardHtml(){
  var sc = cfgSchedule();
  var sched = (S.state && S.state.scheduler) || {};
  var off = Number(sched.scheduleOffsetSeconds) || 0;
  // 账号数决定有多少个间隔；总预算 180 秒按间隔数均分（lib/sched.js paceBudgetFor）
  var accCount = ((S.state && S.state.accounts) || []).length;
  var gaps = Math.max(0, accCount - 1);
  var PACE_BUDGET = 180;
  var perGap = gaps ? Math.max(1, Math.floor(PACE_BUDGET / gaps)) : 0;
  var effMax = gaps ? Math.min(sc.accountDelayMaxSeconds || 0, perGap) : 0;
  var effMin = gaps ? Math.min(sc.accountDelayMinSeconds || 0, effMax) : 0;
  var capped = gaps > 0 && effMax < sc.accountDelayMaxSeconds;
  return '<div class="card"><div class="card-h"><h3>账号错峰</h3><span class="grow"></span>' +
    '<span class="tiny">' + (off ? ('今日签到已错峰 +' + Math.round(off / 60) + ' 分钟') : '降低多账号同刻批量特征') + '</span></div>' +
    '<div class="inline">' +
    '<div class="field"><label>随机延后（0-60 分钟）</label><input type="number" id="schRandom" min="0" max="60" value="' + (sc.randomDelayMinutes || 0) + '"></div>' +
    '<div class="field"><label>账号间隔最小（秒）</label><input type="number" id="schMin" min="0" max="600" value="' + (sc.accountDelayMinSeconds || 0) + '"></div>' +
    '<div class="field"><label>账号间隔最大（0-600 秒）</label><input type="number" id="schMax" min="0" max="600" value="' + (sc.accountDelayMaxSeconds || 0) + '"></div>' +
    '</div>' +
    '<div class="tiny" style="margin-top:10px;line-height:1.7">' +
    '<b>随机延后</b>：每天任务在基准时间基础上再随机推迟 0-60 分钟，避免每天同一秒开跑。<br>' +
    '<b>账号间隔</b>：同批里账号之间随机等「最小-最大」秒。<br>' +
    (gaps
      ? '当前 <b>' + accCount + '</b> 个账号 = <b>' + gaps + '</b> 个间隔，总等待预算 <b>180 秒</b>按间隔数均分，' +
        '每个间隔最多 <b>' + perGap + ' 秒</b> → <b>实际生效区间 ' + effMin + '~' + effMax + ' 秒</b>。' +
        (capped ? '<br><span style="color:var(--warn)">配的上限 ' + sc.accountDelayMaxSeconds + ' 秒超过每份预算 ' + perGap + ' 秒，实际按 ' + effMax + ' 秒执行。</span>' : '')
      : '账号数不足 2 个，没有账号间隔。') +
    '<br>三项都填 0 = 到点即跑（与改造前完全一致）；最小 > 最大时会自动对调。</div>' +
    '<div style="margin-top:12px"><button class="btn primary" data-act="saveSchedule">' + icon('check',13) + '保存错峰设置</button></div></div>';
}

/* 临时停用：两档语义，别让用户以为「停用 = 删号」 */
function openPauseDrawer(id){
  var a = (S.state.accounts || []).find(function(x){ return x.id === id; });
  if (!a){ toast('账号不存在', 'bad'); return; }
  var body =
    '<div class="tiny" style="margin-bottom:14px;line-height:1.8">正在停用：<b style="color:var(--tx)">' + esc(a.nickname) + '</b><br>' +
    '停用只是下线动作，凭证与积分都保留，随时可以一键恢复；删号才会丢凭证。<br>' +
    '卡片上的开关走的就是这里：亮 = 转发在线，灭 = 已停用。</div>' +
    '<div class="rowline"><div class="t"><b>仅停转发</b><span>代理转发与对话下线，签到、保活、小喵照常跑（推荐）</span></div>' +
    '<button class="btn sm" data-act="pauseDo" data-id="' + esc(a.id) + '" data-mode="forward-only">停转发</button></div>' +

/* ============ 操作分发 ============ */
document.addEventListener('click', async function(e){
  var btn = e.target.closest('[data-act]');
  if (btn){
    e.preventDefault();
    await handleAct(btn.getAttribute('data-act'), btn, btn.getAttribute('data-id') || btn.getAttribute('data-tab'));
    return;
  }
  var cp = e.target.closest('[data-copy]');
  if (cp){ copyText(cp.getAttribute('data-copy')); }
});
document.addEventListener('change', async function(e){
  var t = e.target;
  if (t.id === 'pxStrategy' || t.id === 'pxSticky' || t.id === 'pxFailover') return;
});

async function handleAct(act, btn, id){
  try{
    if (act === 'add'){ openAccountDrawer(null); return; }
    if (act === 'qrlogin' || act === 'smslogin'){ openSmsLogin(); return; }
    if (act === 'relogin'){ reloginAccount(id, btn); return; }
    if (act === 'edit'){ openAccountDrawer(id); return; }
    if (act === 'refreshAll'){
      btn.disabled = true; btn.innerHTML = '刷新中…';
      var r = await api('/api/accounts/refresh-all', { body:{} });
      var okc = r.results.filter(function(x){ return x.ok; }).length;
      toast('已刷新 ' + okc + ' / ' + r.results.length + ' 个账号', okc===r.results.length?'ok':'warn');
      await refresh(); return;
    }
    if (act === 'refresh'){
      btn.disabled = true;
      await api('/api/accounts/' + id + '/refresh', { body:{} });
      toast('额度已更新', 'ok'); await refresh(); return;
    }
    if (act === 'del'){
      var a2 = S.state.accounts.find(function(x){ return x.id === id; });
      if (!confirm('确定删除账号「' + a2.nickname + '」？此操作不可撤销。')) return;
      await api('/api/accounts/' + id + '/delete', { body:{} });
      toast('已删除', 'ok'); await refresh(); return;
    }
    /* ---- 积分（实时 / 流水） ---- */
    if (act === 'creditsRefreshOne'){
      btn.disabled = true;
      try{
        var cr1 = await api('/api/credits/refresh', { body:{ id:id }, timeout: 90000 });
        if (!cr1){
          toast('刷新完成，但服务端没返回余额', 'warn');
        } else if (cr1.ok === false){
          toast('刷新失败：' + (cr1.error || '未知错误'), 'bad');
        } else {
          // 首次刷新（没有上一次余额可比）delta 为 null，此时只报积分值，别拼成「+null」
          var dRaw = cr1.delta;
          var hasDelta = dRaw !== null && dRaw !== undefined && isFinite(Number(dRaw)) && Number(dRaw) !== 0;
          toast('实时积分 ' + fmtCredit(cr1.credits) +
            (hasDelta ? ('（' + (Number(dRaw) > 0 ? '+' : '') + fmtCredit(dRaw) + '）') : ''), 'ok');
        }
      }catch(err){
        toast(apiErrText(err, '积分'), err && err.status === 503 ? 'warn' : 'bad');
      }
      btn.disabled = false;
      await refresh();
      return;
    }
    if (act === 'creditsRefresh'){
      var oldTxt = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '刷新中…';
      // 全量是「账号数 × 2」次上游请求（summary + paid-packages，中间 300~800ms 错峰），
      // 30 个账号约 20~30 秒，所以先明确告知，别让用户以为卡死。
      toast('正在逐个查询上游实时积分' + ((S.state.accounts || []).length > 5 ? '，账号较多约需 20~30 秒' : '') + '…');
      try{
        var crAll = await api('/api/credits/refresh', { body:{}, timeout: 300000 });
        var rs = (crAll && crAll.results) || [];
        var okN = rs.filter(function(x){ return x && x.ok; }).length;
        toast(rs.length ? ('已刷新 ' + okN + ' / ' + rs.length + ' 个账号的实时积分') : '没有可刷新的账号',
          (rs.length && okN === rs.length) ? 'ok' : 'warn');
      }catch(err){
        toast(apiErrText(err, '积分'), err && err.status === 503 ? 'warn' : 'bad');
      }
      btn.disabled = false; btn.innerHTML = oldTxt;
      await refresh();
      return;
    }
    if (act === 'ledgerRefresh'){
      btn.disabled = true;
      await loadLedger();
      btn.disabled = false;
      toast('流水已刷新', 'ok');
      return;
    }
    /* ---- 保活 ---- */
    if (act === 'toggleKeepalive'){
      var k0 = cfgKeepalive();
      var kOn = !k0.enabled;
      var okK = await saveSection('keepalive', {
        enabled: kOn,
        activeReport: k0.activeReport,
        renewDaysThreshold: clampNum(el('kaThreshold'), 1, 30, k0.renewDaysThreshold || 3),
        intervalMinutes: clampNum(el('kaInterval'), 30, 1440, k0.intervalMinutes || 720)
      });
      if (okK) toast(kOn ? '自动保活已开启' : '自动保活已关闭', 'ok');
      await refresh(); return;
    }
    if (act === 'toggleKeepaliveActive'){
      var k1 = cfgKeepalive();
      var aOn = !k1.activeReport;
      var okA = await saveSection('keepalive', {
        enabled: k1.enabled,
        activeReport: aOn,
        renewDaysThreshold: clampNum(el('kaThreshold'), 1, 30, k1.renewDaysThreshold || 3),
        intervalMinutes: clampNum(el('kaInterval'), 30, 1440, k1.intervalMinutes || 720)
      });
      if (okA) toast(aOn ? '已开启活跃上报（上游暂无该接口，仅记录尝试）' : '已关闭活跃上报', 'ok');
      await refresh(); return;
    }
    if (act === 'saveKeepalive'){
      var k2 = cfgKeepalive();
      var okS = await saveSection('keepalive', {
        enabled: k2.enabled,
        activeReport: k2.activeReport,
        renewDaysThreshold: clampNum(el('kaThreshold'), 1, 30, 3),
        intervalMinutes: clampNum(el('kaInterval'), 30, 1440, 720)
      });
      if (okS) toast('保活设置已保存', 'ok');
      await refresh(); return;
    }
    if (act === 'keepaliveRun'){
      btn.disabled = true; btn.innerHTML = '保活中…';
      try{
        var kr = await api('/api/keepalive/run', { body:{}, timeout: 240000 });
        if (kr && kr.ok === false) toast('保活未执行：' + (kr.reason || '未知原因'), 'warn');
        else toast('保活完成：' + (kr.result || '已执行'), 'ok');
      }catch(err){
        toast(apiErrText(err, '保活'), err && err.status === 503 ? 'warn' : 'bad');
      }
      btn.disabled = false; btn.innerHTML = icon('shield',13) + '立即保活';
      await loadKeepaliveStatus();
      await refresh();
      return;
    }
    /* ---- 错峰 ---- */
    if (act === 'saveSchedule'){
      var rd = clampNum(el('schRandom'), 0, 60, 0);
      var mn = clampNum(el('schMin'), 0, 600, 0);
      var mx = clampNum(el('schMax'), 0, 600, 0);
      // 后端对 min>max 会自动对调，前端也照做并说明，避免用户以为填反了没生效
      var swapped = false;
      if (mx < mn){ var tmpMin = mn; mn = mx; mx = tmpMin; swapped = true; }
      var okSch = await saveSection('schedule', {
        randomDelayMinutes: rd,
        accountDelayMinSeconds: mn,
        accountDelayMaxSeconds: mx
      });
      if (okSch){
        if (!rd && !mn && !mx) toast('已关闭错峰（到点即跑）', 'ok');
        else if (swapped) toast('已保存：最小/最大填反了，已自动对调为 ' + mn + '-' + mx + ' 秒', 'warn');
        else toast(mx > 180 ? ('错峰已保存（单次调度等待合计上限 180 秒）') : '错峰设置已保存', 'ok');
      }
      await refresh(); return;
    }
    /* ---- 临时停用 / 恢复 ---- */
    if (act === 'pauseAccount'){ openPauseDrawer(id); return; }
    if (act === 'pauseDo'){
      var mode = btn.getAttribute('data-mode') === 'all' ? 'all' : 'forward-only';
      btn.disabled = true;
      try{
        await api('/api/accounts/' + id + '/pause', { body:{ mode: mode } });
        closeDrawer();
        toast(mode === 'all' ? '已完全停用（连签到也停）' : '已停转发（签到 / 保活照常）', 'ok');
      }catch(err){
        toast(err.message || '停用失败', 'bad');
        btn.disabled = false;
        return;
      }
      await refresh(); return;
    }
    if (act === 'resumeAccount'){
      btn.disabled = true;
      try{
        await api('/api/accounts/' + id + '/resume', { body:{} });
        toast('已恢复启用', 'ok');
      }catch(err){
        toast(err.message || '恢复失败', 'bad');
        btn.disabled = false;
        return;
      }
      await refresh(); return;
    }
    if (act === 'signone'){
      btn.disabled = true; btn.innerHTML = '签到中…';
      var r1 = await api('/api/checkin/one', { body:{ id:id } });
      toast(r1.skipped ? ('跳过：' + r1.reason) : ('签到成功 +' + (r1.credit||0) + ' 积分'), r1.skipped?'warn':'ok');
      await refresh(); return;
    }
    if (act === 'signAll'){
      btn.disabled = true; btn.innerHTML = '签到中…';
      var r2 = await api('/api/checkin/all', { body:{} });
      var ok2 = r2.results.filter(function(x){ return x.ok && !x.skipped; }).length;
      var skip = r2.results.filter(function(x){ return x.ok && x.skipped; }).length;
      toast('签到完成：成功 ' + ok2 + '，跳过 ' + skip + '，失败 ' + (r2.results.length-ok2-skip), 'ok');
      await refresh(); return;
    }
    if (act === 'toggleProxy'){
      var on = !S.state.settings.proxy.enabled;
      await api('/api/settings', { body:{ proxy:{ enabled:on } } });
      toast(on?'反向代理已开启':'反向代理已关闭', 'ok'); await refresh(); return;
    }
    if (act === 'toggleAnon'){
      await api('/api/settings', { body:{ proxy:{ allowAnonymous: !S.state.settings.proxy.allowAnonymous } } });
      await refresh(); return;
    }
    if (act === 'toggleCacheFriendly'){
      var cf = S.state.settings.proxy.cacheFriendly === false;
      await api('/api/settings', { body:{ proxy:{ cacheFriendly: cf } } });
      toast(cf?'已开启缓存友好化（输入侧积分可降 90%）':'已关闭缓存友好化', 'ok');
      await refresh(); return;
    }
    /* ---- 模型管理 ---- */
    if (act === 'toggleAutoSelect'){
      var asOn = !S.state.settings.proxy.autoSelectModel;
      await api('/api/settings', { body:{ proxy:{ autoSelectModel: asOn } } });
      toast(asOn ? '已开启按时段自动选模型' : '已关闭自动选模型', 'ok');
      await refresh(); await loadModelInfo(false); return;
    }
    if (act === 'reloadModels'){
      toast('正在从上游拉取最新倍率…');
      await loadModelInfo(true);
      toast('模型倍率已刷新', 'ok');
      return;
    }
    if (act === 'modelSyncRun'){
      var btnEl = e.target.closest('button');
      if(btnEl){ btnEl.disabled = true; btnEl.textContent = '同步中…'; }
      try{
        var sr = await api('/api/models/sync/run', { body:{} });
        if(sr && sr.ok){
          var rs = (sr.result) || {};
          toast('同步完成：新增 ' + (rs.added||0) + ' / 下架 ' + (rs.removed||0) + ' / 倍率变动 ' + (rs.rateChanged||0), 'ok');
        } else {
          toast('同步失败：' + ((sr && sr.error) || '未知原因'), 'bad');
        }
        await loadModelSync();
        await loadModelInfo(true);
      }catch(err){
        toast('同步失败：' + err.message, 'bad');
      }finally{
        if(btnEl){ btnEl.disabled = false; btnEl.textContent = '立即同步'; }
      }
      return;
    }

    if (act === 'modelSelAll' || act === 'modelSelNone' || act === 'modelSelFree'){
      var boxes = document.querySelectorAll('.mwl');
      var want = act === 'modelSelAll' ? 'all' : (act === 'modelSelNone' ? 'none' : 'free');
      var freeIds = {};
      if(MODELV.data && MODELV.data.models){
        for(var mi = 0; mi < MODELV.data.models.length; mi++){
          if(MODELV.data.models[mi].rate === 0) freeIds[MODELV.data.models[mi].id] = 1;
        }
      }
      for(var bi = 0; bi < boxes.length; bi++){
        var v = boxes[bi].value;
        boxes[bi].checked = want === 'all' ? true : (want === 'none' ? false : !!freeIds[v]);
      }
      toast(want === 'all' ? '已全选（记得点保存）' : (want === 'none' ? '已全不选（记得点保存）' : '已只留免费模型（记得点保存）'));
      return;
    }

var smsCtl = { id:'', phone:'', left:0, timer:null };

/* 自动注册（新手机号建号）会话状态 */

function regMsg(text, cls){

/* 注册进度步骤条：idx 0=发码 1=校验建号 2=换会话凭证 3=绑定并激活 */
function paintRegSteps(idx, note){
  var box = el('regSteps'); if (!box) return;
  var steps = ['发注册验证码','校验并建号','换取会话凭证','绑定并激活'];
  var html = '';
  for (var i=0;i<steps.length;i++){
    var bg = i < idx ? 'var(--ok)' : (i === idx ? 'var(--accent)' : '#3a3f4b');
    var col = (i <= idx) ? '#fff' : '#9aa3b2';
    html += '<span style="display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-size:12px;background:'+bg+';color:'+col+';margin:0 2px">'+
            '<b style="display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:rgba(255,255,255,.25)">'+(i+1)+'</b>'+steps[i]+'</span>';
    if (i < steps.length-1) html += '<span style="color:var(--muted);margin:0 1px">→</span>';
  }
  box.innerHTML = html;
  var n = el('regStepNote'); if (n) n.textContent = note || '';
}
function regStepFromStatus(st){
  if (!st || !st.step) return 1;
  var m = { verifying:1, creating:1, selecting:1, capturing:2, login_code:2, done:3 };
  var idx = (m[st.step] !== undefined) ? m[st.step] : 1;
  var note = '';
  if (idx === 2){
    note = '「换取会话凭证」由腾讯 OneID 完成，通常 30–80 秒，请耐心等待，不要重复点击。';
    if (st.step === 'login_code') note += ' 当前已超时，正在改走一次登录验证码（再填一次短信码即可）。';
  }
  return { idx: idx, note: note };
}

function smsSet(text, cls){
  var n = el('smsState');
  if (!n) return;
  n.textContent = text || '';
  n.style.color = cls === 'bad' ? 'var(--bad)' : cls === 'ok' ? 'var(--ok)' : cls === 'warn' ? 'var(--warn)' : 'var(--tx2)';
}

function smsCountdown(sec){
  smsCtl.left = sec;
  if (smsCtl.timer) clearInterval(smsCtl.timer);
  var btn = el('smsSend');
  var tick = function(){
    if (!btn) return;
    if (smsCtl.left <= 0){
      clearInterval(smsCtl.timer); smsCtl.timer = null;
      btn.disabled = false; btn.textContent = '重新发送';
      return;
    }
    btn.disabled = true; btn.textContent = smsCtl.left + 's 后重发';
    smsCtl.left -= 1;
  };
  tick();
  smsCtl.timer = setInterval(tick, 1000);
}

async function reloginAccount(id, btn){
  if (btn){ btn.disabled = true; btn.textContent = '发码中…'; }
  try{
    var r = await api('/api/accounts/' + id + '/relogin', { body:{} });
    if (!r || r.ok === false){ toast((r && r.error) || '发起重新登录失败', 'warn'); return; }

    toast('发起重新登录失败：' + err.message, 'warn');
  }finally{
    if (btn){ btn.disabled = false; btn.innerHTML = icon('key',12) + '重新登录'; }
  }
}
