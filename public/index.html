  var phoneBlock = mode === 'session'
    ? '<div class="field"><label>目标账号</label><div class="tiny" style="padding:6px 0">'+esc(opts.masked || '')+'（验证码已发出，号码只存在服务端）</div></div>'
    : '<div class="field"><label>手机号（workbuddy.cn 登录用）</label>' +
      '<input id="smsPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="11 位手机号" autocomplete="tel" value="'+esc(saved)+'"></div>';
  var body =
    phoneBlock +
    '<div class="field"><label>短信验证码</label>' +
      '<div style="display:flex;gap:8px;align-items:stretch">' +
        '<input id="smsCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 位数字" style="flex:1" autocomplete="one-time-code">' +
        '<button class="btn" id="smsSend" style="white-space:nowrap;min-width:112px">发送验证码</button>' +
      '</div></div>' +
    '<div id="smsState" class="tiny" style="min-height:18px;margin-top:4px"></div>' +
    '<div class="help" style="margin-top:12px;line-height:1.75">' +
      '这里用的是你平时登录 workbuddy.cn 的<b>手机号</b>。点「发送验证码」→ 手机收到短信 → 填进来到此完成一次登录，服务器会自己把会话（Cookie + accessToken + refreshToken）收走入库。<br>' +
      '你全程不用复制任何 Cookie。之后靠 refreshToken 自动续期，正常情况下只需做这一次。<br>' +
      '<b style="color:var(--warn)">点「登录并保存」后通常要等 30 秒到 3 分钟</b>——服务器要拉起真实浏览器、走完上游的验证码校验与换票流程，' +
      '期间界面会显示当前进度和已等待秒数，<b>不是卡死</b>，请不要重复点击。<br>' +
      '<div style="margin-top:10px"><a href="javascript:void 0" id="smsToQr" style="color:var(--brand)">走不通？改用微信扫码</a></div>' +
    '</div>';
  openDrawer(mode === 'session' ? '重新登录' : '手机号登录', body, '<button class="btn" data-close="1">关闭</button><button class="btn primary" id="smsLogin">登录并保存</button>');
  if (mode === 'session'){
    smsCtl.id = opts.sessId; smsCtl.phone = '';
    smsSet('验证码已发往 ' + (opts.masked || '该账号') + '，填入收到的 6 位码', 'ok');
    smsCountdown(60);
    var ce0 = el('smsCode'); if (ce0) ce0.focus();
  }
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeDrawer); });

  el('smsToQr').addEventListener('click', function(){ closeDrawer(); setTimeout(openQrLogin, 120); });

  el('smsSend').addEventListener('click', async function(){
    var phone = mode === 'session' ? '' : (el('smsPhone').value || '').replace(/\D/g, '');
    if (mode !== 'session' && !/^1[3-9]\d{9}$/.test(phone)){ smsSet('请输入 11 位大陆手机号', 'bad'); return; }
    var btn = el('smsSend');
    btn.disabled = true; btn.textContent = '发送中…';
    smsSet('正在打开登录页并发送验证码，首次约需 10 秒…');
    try{
      // 换了号码就重开会话，避免旧 session 与号码不匹配
      var r;
      if (mode === 'session' && smsCtl.id){
        r = await api('/api/login/sms/' + smsCtl.id + '/resend', { body:{} });
      } else if (smsCtl.id && smsCtl.phone === phone){
        r = await api('/api/login/sms/' + smsCtl.id + '/resend', { body:{} });
      } else {
        r = await api('/api/login/sms/start', { body:{ phone: phone } });
        smsCtl.id = r.id; smsCtl.phone = phone;
      }
      try { localStorage.setItem('wb_last_phone', phone); } catch(e){}
      if (r && r.ok === false){
        smsSet(r.error || '发送失败', 'bad');
        btn.disabled = false; btn.textContent = '重新发送';
        return;
      }
      smsSet('验证码已发往 ' + (r && r.masked ? r.masked : (mode === 'session' ? (opts.masked || '该账号') : (phone.slice(0,3) + '****' + phone.slice(-4)))) + (mode === 'session' ? '' : '，这个号不对就改上面的输入框'), 'ok');
      smsCountdown(r && r.expiresIn ? Math.max(30, r.expiresIn) : 60);
      var codeEl = el('smsCode');
      if (codeEl) codeEl.focus();
    }catch(err){
      smsSet('发送失败：' + err.message, 'bad');
      btn.disabled = false; btn.textContent = '重新发送';
    }
  });

  el('smsLogin').addEventListener('click', async function(){
    var phone = (el('smsPhone').value || '').replace(/\D/g, '');
    var code = (el('smsCode').value || '').replace(/\D/g, '');
    if (!smsCtl.id || (mode !== 'session' && smsCtl.phone !== phone)){ smsSet('请先点「发送验证码」', 'warn'); return; }
    if (code.length < 4){ smsSet('请填入短信里的验证码', 'warn'); return; }
    var btn = el('smsLogin');
    btn.disabled = true; btn.textContent = '登录中…';

    // 轮询服务端进度：整个登录要跑 30~180 秒（要走真实浏览器 + 上游换票），
    // 没有进度反馈时界面只有「登录中…」，用户会以为卡死。
    var t0 = Date.now();
    var stepText = '正在校验并换取会话…';
    smsSet(stepText + '（0 秒）');
    var poll = setInterval(function(){
      var sec = Math.round((Date.now() - t0) / 1000);
      if (sec > 240){ clearInterval(poll); return; }
      api('/api/login/sms/' + smsCtl.id + '/status').then(function(s){
        if (!s || s.ok === false) return;
        stepText = s.stepText || stepText;
        smsSet(stepText + '（' + sec + ' 秒）');
      }).catch(function(){});
    }, 2000);

    try{
      var r = await api('/api/login/sms/' + smsCtl.id + '/verify', { body:{ code: code }, timeout: 300000 });
      clearInterval(poll);
      if (r && r.ok){
        var nm = r.account ? r.account.nickname : '';
        smsSet('登录成功' + (nm ? '：' + nm : '') + '，会话已保存', 'ok');
        toast('账号已添加' + (nm ? '：' + nm : ''), 'ok');
        btn.textContent = '已完成';
        await refresh();
        setTimeout(function(){ closeDrawer(); }, 1300);
        return;
      }
      smsSet((r && r.error) || '登录失败，请重试', 'bad');
      btn.disabled = false; btn.textContent = '重试登录';
    }catch(err){
      clearInterval(poll);
      if (err && err.timeout){
        // 超时不代表服务端失败——后台可能仍在跑。让用户回账号列表核对，
        // 而不是让按钮无限停在「登录中…」。
        smsSet('等待超时（5 分钟）。服务器可能仍在后台完成，请到账号列表查看；若没有该账号再重试', 'warn');
        btn.disabled = false; btn.textContent = '重试登录';
        await refresh();
        return;
      }
      smsSet('登录失败：' + err.message, 'bad');
      btn.disabled = false; btn.textContent = '重试登录';
    }
  });

  setTimeout(function(){
    var p = el('smsPhone');
    if (p && !p.value) p.focus();
    else { var c = el('smsCode'); if (c) c.focus(); }
  }, 60);
}

function openQrLogin(){
  var body =
    '<div style="display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 2px">' +
      '<div id="qrFrame" style="width:224px;height:224px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)">' +
        '<div class="tiny" id="qrLoading" style="color:#666">正在启动登录页…</div>' +
      '</div>' +
      '<div id="qrState" class="tiny" style="min-height:18px;text-align:center">二维码由服务器实时渲染，请稍候</div>' +
      '<div id="qrCountdown" class="tiny" style="color:var(--tx3)"></div>' +
    '</div>' +
    '<div class="help" style="margin-top:14px;line-height:1.7">扫码全程在服务器端完成：服务自己打开 workbuddy.cn 登录页 → 抓二维码 → 你扫完并在手机确认 → 服务器自动把会话 Cookie 收走入库。<br>不需要再复制 Cookie，也不用装扩展。二维码约 5 分钟有效，过期点「重新获取」即可。</div>';
  openDrawer('扫码添加账号', body, '<button class="btn" data-close="1">关闭</button><button class="btn primary" id="qrAgain" disabled>重新获取二维码</button>');
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeDrawer); });
  el('qrAgain').addEventListener('click', function(){ qrRestart(); });
  qrRestart();
}

var qrCtl = null;

function qrSetState(text, cls){
  var n = el('qrState');
  if (!n) return;
  n.textContent = text;
  n.style.color = cls === 'bad' ? 'var(--bad)' : cls === 'ok' ? 'var(--ok)' : cls === 'warn' ? 'var(--warn)' : 'var(--tx2)';
}

function qrShowImage(dataUrl){
  var f = el('qrFrame');
  if (!f) return;
  f.innerHTML = '<img alt="微信登录二维码" style="width:100%;height:100%;object-fit:contain;display:block" src="' + dataUrl + '">';
}

function qrStop(cancel){
  if (qrCtl && qrCtl.timer) clearInterval(qrCtl.timer);
  if (qrCtl && cancel && qrCtl.id){ api('/api/login/qr/' + qrCtl.id + '/cancel', { body:{} }).catch(function(){}); }
  qrCtl = null;
}

async function qrRestart(auto){
  var prevCount = (auto && qrCtl) ? (qrCtl.autoCount || 0) : 0;
  qrStop(true);
  var f = el('qrFrame');
  if (f && !auto) f.innerHTML = '<div class="tiny" id="qrLoading" style="color:#666">正在启动登录页…</div>';
  qrSetState(auto ? '二维码已自动刷新，请用微信扫描' : '正在启动登录页并抓取二维码…');
  var again = el('qrAgain');
  if (again){ again.disabled = true; again.textContent = '获取中…'; }
  try{
    var r = await api('/api/login/qr/start', { body:{} });
    qrCtl = { id:r.id, expiresAt:r.expiresAt, timer:null, lastQr:'', autoCount: prevCount };
    qrShowImage(r.qr);
    qrCtl.lastQr = r.qr;
    qrSetState('请用微信扫描上方二维码');
    if (again){ again.disabled = false; again.textContent = '重新获取二维码'; }
    qrCtl.timer = setInterval(qrTick, 2000);
  }catch(err){
    qrSetState('启动失败：' + err.message, 'bad');
    if (again){ again.disabled = false; again.textContent = '重试'; }
  }
}

async function qrTick(){
  if (!qrCtl) return;
  if (!el('drawer') || !el('drawer').classList.contains('on')){ qrStop(false); return; }
  var left = Math.max(0, Math.round((qrCtl.expiresAt - Date.now())/1000));
  var cd = el('qrCountdown');
  if (cd) cd.textContent = left > 0 ? ('二维码剩余 ' + Math.floor(left/60) + ' 分 ' + (left%60) + ' 秒') : '';
  try{
    var st = await api('/api/login/qr/' + qrCtl.id);
    if (st.qr && st.qr !== qrCtl.lastQr){ qrShowImage(st.qr); qrCtl.lastQr = st.qr; }
    if (st.status === 'scanned'){ qrSetState('已扫码，请在手机上点击「确认登录」（确认后自动建立会话）', 'warn'); }
    else if (st.status === 'pending'){ /* 保持提示 */ }
    else if (st.status === 'success'){
      qrStop(false);
      var nm = st.account ? st.account.nickname : '';
      qrSetState('登录成功' + (nm ? '：' + nm : '') + '，会话已自动保存', 'ok');
      toast('账号已添加' + (nm ? '：' + nm : ''), 'ok');
      await refresh();
      setTimeout(function(){ closeDrawer(); }, 1400);
    } else if (st.status === 'expired'){
      var n = (qrCtl.autoCount || 0) + 1;
      if (n <= 3){
        qrCtl.autoCount = n;
        await qrRestart(true);
      } else {
        qrStop(false);
        qrSetState('二维码多次过期，请点「重新获取二维码」', 'warn');
      }
    } else if (st.status === 'error'){
      qrStop(false);
      qrSetState(st.error || '登录失败，请重试', 'bad');
    } else if (st.status === 'unknown'){
      qrStop(false);
      qrSetState('任务已结束，请重新获取二维码', 'warn');
    }
  }catch(err){
    qrSetState('轮询失败：' + err.message, 'bad');
  }
}

function openPairingDrawer(pr){
  var base = location.origin;
  var body =
    '<div class="tiny" style="line-height:1.8;margin-bottom:16px">' +
    '在浏览器里登录 workbuddy.cn，然后打开扩展面板，填入下面的配对码与本服务地址。扩展会自动识别登录态、校验后回传，无需手动找令牌。</div>' +
    '<div class="field"><label>配对码（10 分钟内有效，一次性）</label>' +
    '<div class="code" style="font-size:26px;letter-spacing:8px;text-align:center;padding:16px 8px;padding-right:8px">'+esc(pr.code)+'</div></div>' +
    '<div class="field"><label>服务地址</label>' +
    '<div class="code" style="padding-right:76px"><button class="btn sm copy" data-copy="'+esc(base)+'">复制</button>'+esc(base)+'</div></div>' +
    '<div class="help">扩展目录在本项目 <span class="mono">extension/</span>，Chrome 打开 <span class="mono">chrome://extensions</span> → 打开「开发者模式」→「加载已解压的扩展程序」选择该目录。</div>';
  openDrawer('浏览器扩展配对', body, '<button class="btn primary" data-close="1">知道了</button>');
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeDrawer); });
}

function openPasswordDrawer(){
  var body =
    '<div class="field"><label>当前口令</label><input type="password" id="pwCur" autocomplete="current-password"></div>' +
    '<div class="field"><label>新口令（至少 8 位）</label><input type="password" id="pwNew" autocomplete="new-password"></div>' +
    '<div class="field"><label>确认新口令</label><input type="password" id="pwNew2" autocomplete="new-password"></div>' +
    '<div class="help">修改成功后所有已登录会话立即失效，需要重新登录。</div>';
  openDrawer('修改管理员口令', body, '<button class="btn" data-close="1">取消</button><button class="btn primary" id="pwSave">确认修改</button>');
  document.querySelectorAll('[data-close]').forEach(function(b){ b.addEventListener('click', closeDrawer); });
  el('pwSave').addEventListener('click', async function(){
    if (el('pwNew').value !== el('pwNew2').value){ toast('两次输入的新口令不一致', 'bad'); return; }
    try{
      await api('/api/password', { body:{ current: el('pwCur').value, next: el('pwNew').value } });
      closeDrawer();
      toast('口令已修改，请重新登录', 'ok');
      setTimeout(showGate, 800);
    }catch(err){ toast(err.message, 'bad'); }
  });
}

/* ============ 复制 ============ */
async function copyText(text){
  try{
    if (navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); }
    else{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
    toast('已复制', 'ok');
  }catch(e){ toast('复制失败，请手动选中', 'warn'); }
}

/* ============ 启动 ============ */
el('btnLogout').addEventListener('click', async function(){
  try{ await api('/api/logout', { body:{} }); }catch(e){}
  S.authed = false; showGate();
});

(async function boot(){
  try{
    var s = await fetch('/api/session', { credentials:'same-origin' }).then(function(r){ return r.json(); });
    if (s.siteTitle) document.title = s.siteTitle;
    if (!s.initialized){
      el('gateDesc').textContent = '首次使用，请设置管理员口令';
      el('gateHint').textContent = '这个口令只保存在服务端（scrypt 哈希），请务必记牢。';
    }
    if (s.authed){
      S.authed = true; S.csrf = s.csrf;
      S.view = viewFromHash();
      hideGate();
      await loadState();
    } else {
      showGate();
    }
  }catch(err){
    showGate();
    el('gateHint').textContent = '无法连接服务端：' + err.message;
  }
})();

setInterval(function(){
  if (!S.authed) return;
  var t = el('footTime');
  if (t) t.textContent = new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
}, 30000);
</script>
